<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Opening Juxo...</title>
  <script>
    var params = new URLSearchParams(window.location.search);
    var eventCode = params.get("e") || "";
    var profileCode = params.get("p") || "";
    var ua = navigator.userAgent || navigator.vendor;

    if (eventCode) {
      window.location.href = "juxo://event/" + encodeURIComponent(eventCode);
    } else if (profileCode) {
      window.location.href = "juxo://profile/" + encodeURIComponent(profileCode);
    }

    setTimeout(function () {
      if (/iPad|iPhone|iPod/.test(ua)) {
        window.location.replace("https://apple.com");
      } else {
        window.location.replace("https://google.com");
      }
    }, 1500);
  </script>
</head>
<body>
  <p>Opening Juxo...</p>
</body>
</html>
